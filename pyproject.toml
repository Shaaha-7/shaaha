[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shaaha"
version = "1.0.0"
description = "Intelligent Meta-Dispatcher — one import, best backend, always."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "Shaaha", email = "shaaha@example.com" }
]
keywords = [
    "meta-dispatcher", "import-hook", "backend-selection",
    "numpy", "pandas", "polars", "pytorch", "dependency-management"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering",
]

# Shaaha has ZERO required dependencies — it works with whatever you have.
dependencies = []

[project.optional-dependencies]
# Install a sensible default stack
default = ["numpy", "pandas", "pillow", "matplotlib", "scikit-learn", "requests"]
# Full scientific stack
science = ["numpy", "scipy", "pandas", "polars", "matplotlib", "seaborn", "plotly", "scikit-learn", "statsmodels"]
# GPU stack (requires CUDA drivers)
gpu = ["torch", "cupy-cuda12x"]
# NLP stack
nlp = ["transformers", "spacy", "nltk"]
# Development
dev = ["pytest", "pytest-cov", "black", "ruff", "mypy", "pre-commit"]

[project.urls]
Homepage = "https://github.com/shaaha/shaaha"
Documentation = "https://shaaha.readthedocs.io"
Repository = "https://github.com/shaaha/shaaha"
"Bug Tracker" = "https://github.com/shaaha/shaaha/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.black]
line-length = 99
target-version = ["py39", "py310", "py311", "py312"]

[tool.ruff]
line-length = 99
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"
