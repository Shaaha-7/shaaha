[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shaaha"
version = "2.0.2"
description = "Intelligent Meta-Dispatcher — AI-powered backend selection, agent execution, and code optimization."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Shaaha", email = "shaaha@example.com" }]
keywords = ["meta-dispatcher","import-hook","backend-selection","ai-agent","code-optimizer","numpy","pandas","polars","pytorch"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
default  = ["numpy","pandas","pillow","matplotlib","scikit-learn","requests"]
science  = ["numpy","scipy","pandas","polars","matplotlib","seaborn","plotly","scikit-learn","statsmodels"]
gpu      = ["torch","cupy-cuda12x"]
nlp      = ["transformers","spacy","nltk"]
dashboard = ["flask"]
dev      = ["pytest","pytest-cov","black","ruff","mypy","flask"]
all      = ["numpy","scipy","pandas","polars","matplotlib","seaborn","plotly",
            "scikit-learn","statsmodels","requests","httpx","flask","rich"]

[project.urls]
Homepage      = "https://github.com/Shaaha-7/shaaha"
Documentation = "https://github.com/Shaaha-7/shaaha#readme"
Repository    = "https://github.com/Shaaha-7/shaaha"
"Bug Tracker" = "https://github.com/Shaaha-7/shaaha/issues"

[project.scripts]
shaaha = "shaaha.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
shaaha = ["py.typed", "*.pyi"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "--tb=short -q"

[tool.black]
line-length    = 99
target-version = ["py39","py310","py311","py312"]
